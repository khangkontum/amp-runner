name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and toolchain
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/package-release.sh "${TAG#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/Amp-Runner-${TAG#v}-macos-arm64.zip" \
            "dist/Amp-Runner-${TAG#v}-macos-arm64.zip.sha256" \
            --verify-tag --title "Amp Runner $TAG" \
            --notes-file .github/release-notes.md
